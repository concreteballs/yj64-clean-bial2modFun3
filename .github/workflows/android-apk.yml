name: YJ-64 Base and Standalone Monitor Android APKs

on:
  push:
    branches: ['main']
    paths:
      - 'PROTECTED-LINE-GUARD'
  workflow_dispatch:

concurrency:
  group: yj64-base-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build YJ-64 Base and Standalone Monitor APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Verify PROTECTED-LINE-GUARD
        run: |
          python3 tools/verify_guard.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev build-essential gettext autopoint

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Validate Python sources
        run: |
          python -m py_compile main.py services/internal_monitor.py llm_api.py llm_settings.py message_distributor.py

      - name: Clean previous Android build artifacts and logs
        run: |
          rm -rf bin .buildozer
          rm -f build.log buildozer.log
          mkdir -p bin

      - name: Build YJ-64 Base APK
        run: |
          export ACLOCAL_PATH="/usr/share/aclocal"
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Validate base APK output
        run: |
          set -e
          APK=$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no base APK was produced"
            exit 1
          fi
          stat -c '%n %s bytes' "$APK"
          sha256sum "$APK"

      - name: Build standalone YJ-64 Monitor APK
        run: |
          gradle --no-daemon --project-dir monitor-app assembleDebug
          test -f monitor-app/app/build/outputs/apk/debug/app-debug.apk
          stat -c '%n %s bytes' monitor-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum monitor-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yj64-base-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload YJ-64 Base APK
        uses: actions/upload-artifact@v4
        with:
          name: yj64-base-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone YJ-64 Monitor APK
        uses: actions/upload-artifact@v4
        with:
          name: yj64-monitor-apk
          path: monitor-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
